<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Конвертер величин</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 560px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 26px;
            color: #333;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
            background: #fafafa;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
        }
        .row {
            display: flex;
            gap: 16px;
            margin-bottom: 18px;
        }
        .row > div { flex: 1; }
        .field { margin-bottom: 18px; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        button:active { transform: translateY(0); }
        .result {
            margin-top: 24px;
            padding: 18px;
            background: #e8f5e9;
            border-left: 5px solid #4caf50;
            border-radius: 8px;
            font-size: 17px;
            color: #2e7d32;
            font-weight: 600;
            word-break: break-word;
        }
        .error {
            margin-top: 24px;
            padding: 18px;
            background: #ffebee;
            border-left: 5px solid #f44336;
            border-radius: 8px;
            color: #c62828;
            font-weight: 600;
        }
        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧮 Конвертер величин</h1>
        <p class="subtitle">Метрическая ⇄ Имперская система</p>

        <form method="post" id="converterForm">
            <div class="field">
                <label for="category">Категория</label>
                <select name="category" id="category" onchange="updateUnits()">
                    {% for key, units in categories.items() %}
                        <option value="{{ key }}" {% if key == selected_category %}selected{% endif %}>
                            {{ category_labels[key] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="value">Значение</label>
                <input type="text" name="value" id="value"
                       placeholder="Например: 100"
                       value="{{ input_value }}" autocomplete="off">
            </div>

            <div class="row">
                <div>
                    <label for="from_unit">Из</label>
                    <select name="from_unit" id="from_unit"></select>
                </div>
                <div>
                    <label for="to_unit">В</label>
                    <select name="to_unit" id="to_unit"></select>
                </div>
            </div>

            <button type="submit">Конвертировать</button>
        </form>

        {% if result %}
            <div class="result">{{ result }}</div>
        {% endif %}

        {% if error %}
            <div class="error">⚠️ {{ error }}</div>
        {% endif %}
    </div>

    <script>
        // Данные о категориях и единицах, переданные из Python
        const CATEGORIES = {{ categories | tojson }};
        const UNIT_LABELS = {{ unit_labels | tojson }};
        const SELECTED_FROM = "{{ from_unit }}";
        const SELECTED_TO = "{{ to_unit }}";

        function fillSelect(selectEl, units, selectedValue) {
            selectEl.innerHTML = "";
            units.forEach(function (unit) {
                const opt = document.createElement("option");
                opt.value = unit;
                opt.textContent = UNIT_LABELS[unit] || unit;
                if (unit === selectedValue) opt.selected = true;
                selectEl.appendChild(opt);
            });
        }

        function updateUnits() {
            const category = document.getElementById("category").value;
            const units = CATEGORIES[category] || [];
            const fromSel = document.getElementById("from_unit");
            const toSel = document.getElementById("to_unit");

            fillSelect(fromSel, units, SELECTED_FROM);
            fillSelect(toSel, units, SELECTED_TO);

            // Если исходная и целевая совпали — сдвигаем целевую
            if (fromSel.value === toSel.value && units.length > 1) {
                toSel.selectedIndex = (fromSel.selectedIndex + 1) % units.length;
            }
        }

        // Инициализация при загрузке
        document.addEventListener("DOMContentLoaded", function () {
            updateUnits();
        });
    </script>
</body>
</html>
